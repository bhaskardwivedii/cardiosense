# Render Blueprint: New > Blueprint > connect this repo. Creates the web service and a Postgres database.
services:
  - type: web
    name: cardiosense
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cardiosense-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@cardiosense.app
      - key: ADMIN_PASSWORD
        sync: false   # you are asked for it when the Blueprint is created
databases:
  - name: cardiosense-db
    plan: free
    databaseName: cardiosense
